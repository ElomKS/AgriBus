name: CI

on:
  push:
    branches: [main, dev, 'deployment/**', 'feature/**', 'fix/**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tests et audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v5

      - name: Installer Node 22
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Installer les dependances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Audit de securite des dependances
        # --omit=dev : on audite ce qui tourne en production. CVE-2026-93687
        # (braces, via nodemon -> chokidar) n'a aucun correctif et ne touche
        # que la machine de developpement.
        run: npm audit --audit-level=high --omit=dev
